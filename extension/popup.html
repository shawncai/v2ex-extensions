<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V2EX 主题速览</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-5L3 9m0-5v5h5m-4 4a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M3 6h4m6 0h8M3 18h10m6 0h2"/><circle cx="10" cy="6" r="3"/><circle cx="16" cy="18" r="3"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="M19 4.5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2v3l4.5-3H19a2 2 0 0 0 2-2v-10a2 2 0 0 0-2-2Z"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  </svg>
  <header class="masthead">
    <a class="brand" href="https://www.v2ex.com/" target="_blank" rel="noopener noreferrer" title="打开 V2EX 首页">
      <img src="icons/icon-48.png" width="32" height="32" alt="">
      <span class="wordmark">V2EX</span>
    </a>
    <h1>主题速览</h1>
    <div class="tools">
      <button type="button" id="refresh" class="icon-button" aria-label="刷新列表" title="刷新列表"><svg class="icon"><use href="#i-refresh"/></svg></button>
      <button type="button" id="settings-open" class="icon-button" aria-label="令牌设置" title="令牌设置"><svg class="icon"><use href="#i-settings"/></svg></button>
    </div>
  </header>
  <div class="nav-wrap">
    <div class="feed-nav" role="tablist" aria-label="主题列表">
      <button role="tab" type="button" id="tab-latest" data-kind="latest" aria-controls="feed" aria-selected="true">最新主题</button>
      <button role="tab" type="button" id="tab-hot" data-kind="hot" aria-controls="feed" aria-selected="false" tabindex="-1">热门主题</button>
      <button role="tab" type="button" id="tab-node" data-kind="node" aria-controls="feed" aria-selected="false" tabindex="-1">节点主题</button>
    </div>
  </div>
  <main id="feed" role="tabpanel" aria-labelledby="tab-latest">
    <div id="category-choices" role="group" aria-label="选择分类或节点" hidden>
      <button type="button" data-category="jobs">酷工作</button>
      <button type="button" data-category="deals">交易</button>
      <span class="choice-divider" aria-hidden="true"></span>
      <button type="button" data-category="tech">技术</button>
      <button type="button" data-category="creative">创意</button>
      <button type="button" data-category="play">好玩</button>
      <button type="button" data-category="apple">Apple</button>
      <button type="button" id="custom-node-choice">自选节点</button>
    </div>
    <form id="node-form" hidden>
      <label for="node-input">节点名</label>
      <input id="node-input" type="text" maxlength="80" required pattern="[A-Za-z0-9_\-]+" title="使用节点网址 /go/ 后的英文名" list="nodes" autocomplete="off" spellcheck="false" placeholder="如 programmer">
      <datalist id="nodes">
        <option value="programmer">程序员</option><option value="create">分享创造</option>
        <option value="qna">问与答</option><option value="python">Python</option><option value="apple">Apple</option>
      </datalist>
      <button class="text-button" type="submit">查看</button>
    </form>
    <p id="notice" role="status" hidden></p>
    <div id="scroll-area" tabindex="-1">
      <ol id="topics" aria-label="主题"></ol>
      <div id="state" class="state" hidden>
        <h2 id="state-title"></h2>
        <p id="state-message"></p>
        <div class="state-actions">
          <button type="button" class="text-button" id="retry" hidden>重新加载</button>
          <button type="button" class="text-button" id="fix-token" hidden>打开令牌设置</button>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <div class="sync-status" role="status" aria-live="polite"><span id="status-dot"></span><span id="status-text">正在读取主题…</span></div>
    <button type="button" id="apply-update" hidden>查看更新</button>
    <span id="count"></span>
    <nav id="pagination" aria-label="分页" hidden>
      <button type="button" class="icon-button" id="previous" title="上一页" aria-label="上一页"><svg class="icon flip"><use href="#i-chevron"/></svg></button>
      <span id="page-number"></span>
      <button type="button" class="icon-button" id="next" title="下一页" aria-label="下一页"><svg class="icon"><use href="#i-chevron"/></svg></button>
    </nav>
  </footer>
  <dialog id="topic-preview" aria-labelledby="preview-title">
    <div class="preview-bar">
      <span>主题预览</span>
      <button id="preview-close" type="button" class="text-button" autofocus>关闭</button>
    </div>
    <div id="preview-scroll" class="preview-scroll" tabindex="0" role="region" aria-label="主题正文">
      <h2 id="preview-title"></h2>
      <p id="preview-meta"></p>
      <p id="preview-status" role="status" hidden></p>
      <button id="preview-retry" type="button" class="text-button" hidden>重试</button>
      <article id="preview-content"></article>
    </div>
    <div class="preview-actions">
      <a id="preview-open-original" target="_blank" rel="noopener noreferrer">打开原帖</a>
    </div>
  </dialog>
</body>
</html>
