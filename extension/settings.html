<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>令牌设置 · V2EX 主题速览</title>
  <link rel="icon" href="icons/icon-48.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="settings.css">
  <script type="module" src="settings.js"></script>
</head>
<body>
  <main>
    <header>
      <img src="icons/icon-48.png" width="28" height="28" alt="">
      <span class="brand">V2EX</span><span class="brand-name">主题速览</span>
      <span id="settings-state" class="mode" role="status">读取中</span>
    </header>
    <section aria-labelledby="heading">
      <h1 id="heading">令牌设置</h1>
      <p class="intro">连接 API 2.0，即可翻页浏览最新主题和自选节点。</p>
      <form id="settings-form" autocomplete="off">
        <fieldset id="settings-fields" disabled>
          <legend>个人访问令牌</legend>
          <label class="file-picker">
            <svg class="file-symbol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 15V3m-4 4 4-4 4 4M4 15v5h16v-5"/>
            </svg>
            <span class="file-copy">
              <strong>选择配置文件</strong>
              <span id="token-file-hint">读取 .env 或 .txt 中的 TOKEN 字段</span>
            </span>
            <input id="token-file" type="file" aria-label="选择配置文件" aria-describedby="token-file-hint">
          </label>
          <label class="input-label" for="token-input">或手动输入令牌</label>
          <input id="token-input" type="password" autocomplete="off" autocapitalize="none"
            spellcheck="false" placeholder="Personal Access Token">
          <div class="actions">
            <button id="settings-save" type="submit">保存令牌</button>
            <button id="settings-clear" type="button" hidden>切回公开模式</button>
          </div>
          <p id="settings-error" class="message" role="status" aria-live="polite"></p>
        </fieldset>
      </form>
    </section>
    <footer>
      <span>令牌仅在本次 Chrome 会话中保存。</span>
      <a href="https://www.v2ex.com/settings/tokens" target="_blank" rel="noopener noreferrer">管理 V2EX 令牌 <span aria-hidden="true">↗</span></a>
    </footer>
  </main>
</body>
</html>
